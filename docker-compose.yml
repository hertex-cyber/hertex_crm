# TZAHU CRM — Local Development Environment
# Starts all required services: Django, Celery, PostgreSQL, Redis, RabbitMQ, MinIO, Nginx

version: "3.9"

x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DJANGO_SECRET_KEY: dev-insecure-key-do-not-use-in-prod
  POSTGRES_DB: tzahu
  POSTGRES_USER: tzahu
  POSTGRES_PASSWORD: tzahu
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
  CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
  SENTRY_DSN: ""

services:
  # ─── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tzahu
      POSTGRES_USER: tzahu
      POSTGRES_PASSWORD: tzahu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tzahu"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── PgBouncer (Connection Pooling) ─────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:1.22
    environment:
      DB_USER: tzahu
      DB_PASSWORD: tzahu
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: tzahu
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 25
    ports:
      - "5433:5432"
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── RabbitMQ ───────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO (S3-compatible Storage) ──────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Django Backend ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      <<: *django-env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ─── Celery Worker ──────────────────────────────────────────
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    command: celery -A config worker --loglevel=info --concurrency=2
    environment:
      <<: *django-env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ─── Celery Beat (Scheduler) ────────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    command: celery -A config beat --loglevel=info
    environment:
      <<: *django-env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ─── AI Gateway (FastAPI) ──────────────────────────────────
  ai-gateway:
    build:
      context: ./ai_gateway
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./ai_gateway:/app
    depends_on:
      redis:
        condition: service_healthy

  # ─── Frontend (React + Vite) ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ─── Nginx Reverse Proxy ────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  backend_media:
