[project]
name = "tzahu-crm"
version = "0.1.0"
description = "TZAHU CRM — AI-first multi-tenant enterprise CRM platform"
requires-python = ">=3.11"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15,<3.16",
    "django-filter>=24.1",
    "drf-spectacular>=0.27",
    "django-cors-headers>=4.3",
    "django-simple-history>=3.5",
    "django-guardian>=2.4",
    "django-channels>=4.1",
    "django-ratelimit>=4.1",
    "django-import-export>=4.1",
    "celery>=5.4",
    "redis>=5.1",
    "psycopg[binary]>=3.2",
    "psycopg2-binary>=2.9",
    "gunicorn>=22.0",
    "uvicorn>=0.30",
    "structlog>=24.4",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-django>=0.48b0",
    "opentelemetry-instrumentation-celery>=0.48b0",
    "opentelemetry-instrumentation-psycopg2>=0.48b0",
    "opentelemetry-exporter-prometheus>=0.48b0",
    "prometheus-client>=0.20",
    "sentry-sdk>=2.13",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-ulid>=3.0",
    "python-dateutil>=2.9",
    "Pillow>=10.0",
    "PyJWT>=2.9",
    "cryptography>=42.0",
    "django-extensions>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "factory-boy>=3.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs>=5.0",
    "djangorestframework-stubs>=3.15",
    "import-linter>=2.10",
    "pre-commit>=3.8",
    "coverage>=7.6",
    "ipdb>=0.13",
    "werkzeug>=3.0",
]

prod = [
    "gunicorn>=22.0",
    "uvicorn[standard]>=0.30",
    "sentry-sdk>=2.13",
    "opentelemetry-exporter-otlp>=1.27",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "PTH", "ERA", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-width = 4

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_unimported = false

[[tool.mypy.overrides]]
module = ["django.*", "djangorestframework.*", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["apps", "tests"]
addopts = "--reuse-db --no-migrations -p no:cacheprovider"

[tool.coverage.run]
source = ["apps", "config", "common", "infrastructure"]
omit = ["*/tests/*", "*/migrations/*", "*/management/commands/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise NotImplementedError"]

[tool.import-linter]
root_package = "apps"
include_external_packages = true

[[tool.import-linter.contracts]]
name = "domain-imports-only-shared-kernel"
type = "layers"
layers = ["*_management.domain", "shared_kernel.domain"]

[[tool.import-linter.contracts]]
name = "application-imports-domain-and-shared"
type = "layers"
layers = ["*_management.application", "*_management.domain", "shared_kernel"]

[[tool.import-linter.contracts]]
name = "infrastructure-can-import-anything-in-module"
type = "layers"
layers = ["*_management.infrastructure", "*_management", "shared_kernel"]

[[tool.import-linter.contracts]]
name = "api-imports-application-and-infrastructure"
type = "layers"
layers = ["*_management.api", "*_management.application", "*_management.infrastructure"]

[[tool.import-linter.contracts]]
name = "no-cross-module-imports"
type = "forbidden"
forbidden_modules = ["apps.*.domain", "apps.*.infrastructure"]
